# Deterministic detectors. Patterns here run on files the model has already read
# (and on the tracked path list for the path-based ones); anything they report is
# still confirmed by the model. All path globs are matched against the casefolded
# base name unless the key says otherwise.

[audit]
# These rules must be reported with the exact file, line and evidence a detector
# produced; the other detectors are hints the model may confirm or discard.
strict_rule_ids = ["SEC-001", "CI-001", "CI-002"]
# Paths containing one of these (casefolded) are intentional samples.
fixture_fragments = ["tests/fixtures/", "test/fixtures/", "testdata/", "tests/data/"]
workflow_directory = ".github/workflows/"
# Alternatives shown per rule in the prompt catalog; more costs tokens on every turn.
prompt_alternatives_per_rule = 3
# One noisy file or tree must not flood the model's context.
max_findings_per_rule = 25
# GitHub Actions "run:" keys. A block scalar (run: |) covers the more indented lines below.
run_key_pattern = '^(?P<lead>[ \t]*(?:-[ \t]+)?)run[ \t]*:[ \t]*(?P<rest>.*?)[ \t]*$'
block_scalar_start_pattern = '^[|>][+-]?\d?[ \t]*(?:#.*)?$'
comment_pattern = '^[ \t]*#'
# Files over this size are "large" for HYG-005; the model judges it from the listing sizes.
large_file_bytes = 5242880

[guards]
# Checks FindingStore applies to model-reported findings before they join the report.
# A severity may differ from the rule's default by this many steps.
severity_max_steps = 1
# A quote must appear within this many lines either side of the cited line.
grounding_radius = 2
# SEC-* findings in fixture paths ([audit].fixture_fragments) are rejected, except
# for rules whose evidence is a known token format.
fixture_rule_prefixes = ["SEC-"]
fixture_exempt_rules = ["SEC-002"]
# Template copies of config files hold placeholders by design.
template_suffixes = [".example", ".sample", ".template"]
# Matched as a path prefix or as a directory inside the path.
vendored_fragments = ["vendor/", "third_party/", "node_modules/"]
# Documentation shows code snippets, not live configuration.
doc_rule_prefixes = ["SEC-", "CFG-"]
doc_suffixes = [".md", ".markdown", ".rst"]
doc_prefixes = ["docs/", "doc/"]
# Repository settings are not visible in the files.
remote_setting_keywords = ["branch protection", "required review", "repository settings", "protected branch"]

[detectors.hardcoded_credential]
# In these files only a quoted string literal counts as a value; a bare
# identifier, attribute access or call is code, not a credential.
code_globs = [
    "*.py", "*.js", "*.jsx", "*.ts", "*.tsx", "*.go", "*.java", "*.rb", "*.php", "*.cs",
    "*.kt", "*.kts", "*.rs", "*.swift", "*.scala", "*.gradle", "*.groovy",
]
# Configuration formats where an unquoted value is the value.
unquoted_globs = [
    "*.env", ".env", ".env.*", "*.ini", "*.properties", "*.cfg", "*.conf", "*.yml",
    "*.yaml", "*.toml", "*.sh", "*.bash", "dockerfile*", "*.tf", "*.tfvars", "*.json", "*.xml",
]
# A quoted literal in code is deliberate, so a shorter value still counts
# (password = "admin"); unquoted config values keep min_secret_length.
quoted_literal_min_length = 5
# In these formats a value with a space is prose, and a value equal to its own
# key is a schema entry ("password": "password"), not a credential.
prose_globs = ["*.json"]
# Inner text of a quoted literal that is not a real secret.
literal_skip_patterns = [
    '^(.)\1{3,}$',
    '^\{\{.*\}\}$',
    '^\$',
    '(?i)^(?:none|null|nil|undefined)$',
    '(?i)^(?:process\.env|config\.|settings\.|os\.|env\.|self\.)',
]

[detectors.secret_token]
# A line mentioning one of these is a documented fake, not a leak.
fake_markers = ["example", "fake", "dummy", "not-a-secret", "placeholder", "xxxx"]

[detectors.secret_file]
path_globs = [".env", ".env.*", "*.env", "id_rsa", "id_dsa", "id_ecdsa", "id_ed25519", "credentials.json"]
safe_suffixes = [".example", ".sample", ".template", ".dist", ".tpl", ".defaults"]
# A dot-separated part of an env file name that marks a template or a non-secret
# profile (.env.test, example.env).
safe_env_parts = ["example", "sample", "template", "dist", "test", "development", "defaults"]
env_globs = [".env", ".env.*", "*.env"]
# Only reported when the file was read and the pattern matches a literal value.
content_patterns = { ".npmrc" = '_authToken[ \t]*=[ \t]*(?!\$\{|[ \t]|$)\S{8,}', ".pypirc" = '(?im)^[ \t]*password[ \t]*[:=][ \t]*(?!\$\{|[ \t]|$)\S{8,}' }
# Reported only when the file was read and holds a private key; a public
# certificate or an unread key file is not evidence.
private_key_globs = ["*.pem", "*.key"]

[detectors.workflow_write_all]
pattern = '(?i)[ \t]*permissions[ \t]*:[ \t]*write-all[ \t]*(?:#.*)?$'

[detectors.pr_target_checkout]
trigger_pattern = '(?i)\bpull_request_target\b'
checkout_pattern = '(?i)[ \t]*(?:-[ \t]*)?uses[ \t]*:[ \t]*actions/checkout(?:@|[ \t]|$)'
# Patterns here are matched against one line at a time. An untrusted ref is the PR
# head by sha or ref, the merge ref, the head branch name or the fork repository;
# any run: step after such a checkout executes that code.
untrusted_ref_pattern = '''(?ix)
    [ \t]*(?:-[ \t]*)?(?:ref|repository)[ \t]*:[ \t]*
    ["']?(?:
        \$\{\{[ \t]*(?:github\.event\.pull_request\.head\.(?:sha|ref|repo\.full_name)|github\.head_ref)[ \t]*\}\}
      | refs/pull/.*?/(?:merge|head)
    )["']?
    [ \t]*(?:\#.*)?$
'''
related_evidence = "Related workflow evidence: pull_request_target trigger, actions/checkout, and a project test/build command."

[detectors.ungated_check]
# A test or lint command at the start of a command segment (start of the run, or
# after && ; |), so "pip install pytest || true" and "echo pytest" are not gates.
# The override must follow it on the same line.
command_pattern = '''(?ix)
    (?:^|&&|;|\|)[ \t]*
    (?:(?:python[\d.]*[ \t]+-m|poetry[ \t]+run|pipenv[ \t]+run|uv[ \t]+run|npx)[ \t]+)?
    (?:pytest|unittest|tox|nox|npm[ \t]+(?:run[ \t]+)?(?:test|lint)|yarn[ \t]+(?:run[ \t]+)?(?:test|lint)|pnpm[ \t]+(?:run[ \t]+)?(?:test|lint)|go[ \t]+test|cargo[ \t]+(?:test|clippy)|mvn[ \t]+test|gradle[ \t]+test|make[ \t]+(?:test|lint|check)|ruff|flake8|pylint|mypy|eslint|black|isort|golangci-lint|phpunit|rspec|jest|vitest)\b
'''
override_pattern = '(?i)(?:\|\|[ \t]*(?:(?:true|exit[ \t]+0)\b|:(?!\w))|--exit-zero\b|;[ \t]*exit[ \t]+0\b|&&[ \t]*exit[ \t]+0\b)'
# A job that is allowed to fail by design is not a broken gate: its id or name, or a
# matrix.experimental flag in its body.
experimental_job_pattern = '(?i)experimental|nightly|allow[-_]?fail|canary'
continue_on_error_pattern = '''(?i)^(?P<indent>[ \t]*)(?:-[ \t]+)?continue-on-error[ \t]*:[ \t]*["']?true["']?[ \t]*(?:#.*)?$'''
step_start_pattern = '^(?P<indent>[ \t]*)-[ \t]'
# A step's "name:" often mentions the command it runs; only run lines count.
name_pattern = '(?i)^[ \t]*(?:-[ \t]+)?name[ \t]*:'

[detectors.script_injection]
# Only fields an outside user writes: titles, bodies, branch names, commit and page
# metadata. Numbers, SHAs, logins and ids are not attacker-controlled text.
expression_pattern = '''(?ix)
    \$\{\{[ \t]*(?:
        github\.event\.(?:
            (?:pull_request|issue|comment|review|review_comment|discussion|head_commit)
          | (?:commits|pages)\[[^\]]*\]
        )\.(?:title|body|head\.ref|head\.label|head\.repo\.default_branch|message|name|email|page_name|author\.name|author\.email)
      | github\.head_ref
    )[ \t]*\}\}
'''

[detectors.unpinned_action]
uses_pattern = '''^[ \t]*(?:-[ \t]+)?uses[ \t]*:[ \t]*["']?(?P<ref>[^\s"'#]+)'''
local_prefixes = ["./", "docker://"]
branch_refs = ["main", "master", "develop", "dev"]

[detectors.generated_files]
directory_globs = ["__pycache__", "node_modules", "*.egg-info", ".pytest_cache"]
# build/ and dist/ also hold hand-written sources in many projects: they count only
# at the repository root and only for files that look like build output.
top_level_directories = ["build", "dist"]
artefact_suffixes = [".js", ".map", ".whl", ".tar.gz", ".class", ".jar", ".o", ".so", ".exe", ".pyc", ".egg"]
file_globs = ["*.pyc", ".DS_Store", "Thumbs.db", "*.log", "coverage.xml", ".coverage"]

[detectors.absolute_path]
patterns = [
    # One or two backslashes: source code usually writes Windows paths escaped ("C:\\Users\\x").
    '(?<![A-Za-z0-9])[A-Za-z]:(?:\\{1,2}|/)Users(?:\\{1,2}|/)(?P<user>[A-Za-z0-9._-]+)(?:\\{1,2}|/)',
    '(?<![\w.~-])/home/(?P<user>[A-Za-z0-9._-]+)/',
    '(?<![\w.~-])/Users/(?P<user>[A-Za-z0-9._-]+)/',
]
# Account names of CI runners, containers and examples, not a developer machine.
ignored_users = [
    "runner", "vsts", "user", "username", "youruser", "you", "me", "name", "ubuntu", "node", "app",
    "appuser", "www-data", "public", "default", "shared", "circleci", "jenkins", "travis", "buildkite",
    "docker", "all users", "vscode", "codespace", "gitpod", "jovyan", "vagrant", "ec2-user", "centos",
    "debian", "alice", "bob", "john", "jane", "foo", "bar", "example",
]
skip_globs = ["*.md", "*.markdown", "*.rst", "test_*", "*_test.*"]
skip_prefixes = ["docs/", "doc/"]
# Test code names machines on purpose; matched against every directory of the path.
skip_directories = ["tests", "test", "spec", "__tests__"]

[detectors.dockerfile_risk]
file_globs = ["dockerfile", "dockerfile.*", "*.dockerfile"]
from_pattern = '''(?i)^[ \t]*FROM[ \t]+(?:--platform=\S+[ \t]+)?(?P<image>\S+)(?:[ \t]+AS[ \t]+(?P<alias>\S+))?[ \t]*(?:#.*)?$'''
mutable_tag = "latest"
allowed_images = ["scratch"]
# Digests and ARG/ENV-based images cannot be judged from the Dockerfile alone.
reference_markers = ["@", "$"]
pipe_pattern = '(?i)\b(?:curl|wget)\b[^|\n]*\|[ \t]*(?:sudo[ \t]+)?(?:ba|z)?sh\b'
